<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 120">
  <!-- Background (optional, can be removed for transparent) -->
  <rect width="300" height="120" fill="#000000"/>
  
  <!-- A in rose-600 -->
  <text x="10" y="100" font-family="Inter, system-ui, sans-serif" font-size="100" font-weight="900" fill="#e11d48">A</text>
  
  <!-- Wave line through A -->
  <path d="M 25 55 Q 40 45, 55 55 T 85 55" stroke="#ffffff" stroke-width="3" fill="none"/>
  
  <!-- S in white -->
  <text x="100" y="100" font-family="Inter, system-ui, sans-serif" font-size="100" font-weight="900" fill="#ffffff">S</text>
  
  <!-- V in white -->
  <text x="185" y="100" font-family="Inter, system-ui, sans-serif" font-size="100" font-weight="900" fill="#ffffff">V</text>
</svg>
