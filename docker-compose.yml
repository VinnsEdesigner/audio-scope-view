# ============================================
# Audio Scope View - Docker Compose
# ============================================
#
# Usage:
#   docker compose up --build
#   docker compose down
#
# ============================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - BOOTSTRAP_KEY=local_dev_key_change_in_production
      - RUST_BACKTRACE=1
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

