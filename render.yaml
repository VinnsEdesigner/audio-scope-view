services:
  - type: web
    name: audio-scope-view
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: RUST_BACKTRACE
        value: "1"
      # Bootstrap key - should be set via Render dashboard or environment
      - key: BOOTSTRAP_KEY
        generateValue: true
      - key: APP__SECURITY__BOOTSTRAP_KEY
        fromService:
          type: web
          envVarKey: BOOTSTRAP_KEY
      # Database URL - Set via environment variable for Turso
      # Example: libsql://audio-scope-view-xxx.turso.io?authToken=xxx
      # Set TURSO_DATABASE_URL and TURSO_AUTH_TOKEN in Render dashboard
      - key: APP__DATABASE__URL
        fromService:
          type: web
          envVarKey: TURSO_DATABASE_URL
      - key: APP__SERVER__HOST
        value: "127.0.0.1"
      - key: APP__SERVER__PORT
        value: "8080"
      # Frontend build-time vars
      - key: VITE_GRAPHQL_ENDPOINT
        value: "/graphql"
      - key: VITE_WEBSOCKET_ENDPOINT
        value: "ws://localhost:8080/graphql"
      - key: VITE_CLIENT_URL
        value: "https://your-app.onrender.com"
