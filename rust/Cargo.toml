[package]
name = "audio-scope-view"
version = "0.1.1-beta"
edition = "2024"
rust-version = "1.97"
authors = ["VinnsEdesigner"]
description = "Audio Scope View Server - Web-based oscilloscope with GraphQL API"

[lib]
path = "src/lib.rs"
# On Android the crate is cross-compiled to a shared library
# (libaudioscope_server.so) the app links in-process. On desktop/server the
# crate stays the default rlib that the `audio-scope-view` bin links.
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "audio-scope-view"
path = "src/main.rs"

[features]
default = []
# Android on-device storage backend. Only enabled when cross-compiling the
# crate for Android (the mobile app links the Rust server in-process). When
# off, the android module is not compiled at all, so desktop/server builds
# carry no Android storage code. Selected at runtime via the
# `ASV_STORAGE_BACKEND=android` env var; the DB path is taken from
# `ASV_ANDROID_DB_PATH` (default: the app's internal storage).
android = ["dep:jni"]

[target.'cfg(target_os = "android")'.dependencies]
# JNI bindings for the in-process server entry points the Kotlin app calls
# (android_jni.rs). Optional + gated by the `android` feature so a host build
# (default features) never pulls the jni crate.
jni = { version = "0.21", default-features = false, optional = true }

[dependencies]
# Web framework
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
http = "1"

# GraphQL
async-graphql = { version = "7.2", features = ["chrono"] }
async-graphql-axum = "7.2"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["codec"] }
async-trait = "0.1"

# Database
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-rustls", "migrate", "chrono", "tls-rustls"] }

# HTTP client for Turso cloud connections
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Configuration
config = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Validation
validator = { version = "0.19", features = ["derive"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Futures utilities
futures-util = "0.3"

# Cryptography
sha2 = "0.10"

# HTTP headers for auth middleware
headers = "0.4"

# Binary data handling
bytes = "1"

# cpal - cross-platform audio
# Supports: ALSA, PulseAudio, WASAPI, CoreAudio, OpenSL ES (Android), WebAudio (wasm)
cpal = "0.15"

# The DSP algorithms (FFT, measurements, spectrogram, LZ4 compression, signal
# generation) now live in the C++ core under sdk/dsp, reached via the C ABI in
# sdk/bindings/ffi and the safe wrapper in src/infrastructure/dsp_ffi.rs. The
# rustfft, num-complex, lz4, and rand crates were DSP-only and are removed.

[build-dependencies]
# Compiles the C++ core + FFI bridge into the server binary at build time.
cc = "1.0"

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.13"
async-graphql = "7"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
