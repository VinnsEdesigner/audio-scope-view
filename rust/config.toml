# Audio Scope View Configuration
# All values can be overridden via environment variables

[server]
host = "127.0.0.1"
port = 8080

[database]
url = "sqlite:./data/audio_scope_view.db?mode=rwc"

[graphql]
playground_enabled = true
introspection_enabled = true

[audio]
# Default audio capture backend: "mock", "alsa", "pulse"
backend = "mock"

[security]
# Require API key authentication for GraphQL endpoints
require_auth = true
# Bootstrap key for initial setup (should be changed in production)
# IMPORTANT: Must be set via BOOTSTRAP_KEY environment variable!
# The BOOTSTRAP_KEY env var takes precedence over this value.
# Generate a secure random key: openssl rand -base64 32
bootstrap_key = ""

[logging]
level = "info"
