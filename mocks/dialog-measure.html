<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Measurements</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Geist', sans-serif;
      background: rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .dialog {
      width: 100%;
      max-width: 420px;
      background: #212124;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      overflow: hidden;
    }
    .dialog-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .dialog-title {
      font-size: 15px;
      font-weight: 600;
      color: #f5f5f7;
    }
    .close-btn {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      color: #a1a1aa;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.15s;
    }
    .close-btn:hover {
      background: #2e2e33;
      color: #f5f5f7;
    }
    .dialog-content {
      padding: 20px;
    }
    .info-text {
      font-size: 12px;
      color: #6e6e73;
      line-height: 1.5;
      margin-bottom: 16px;
    }
    .measure-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .measure-card {
      background: #28282c;
      border-radius: 8px;
      padding: 14px;
    }
    .measure-value {
      font-size: 18px;
      font-weight: 600;
      font-family: 'Geist Mono', monospace;
      color: #f5f5f7;
    }
    .measure-label {
      font-size: 11px;
      color: #6e6e73;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 4px;
    }
    .dialog-footer {
      display: flex;
      gap: 8px;
      padding: 16px 20px;
      background: #28282c;
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    .btn-footer {
      flex: 1;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      border: 1px solid rgba(255,255,255,0.1);
      background: transparent;
      color: white;
    }
    .btn-footer:hover {
      background: #2e2e33;
    }
  </style>
</head>
<body>
  <div class="dialog">
    <div class="dialog-header">
      <span class="dialog-title">Measurements</span>
      <button class="close-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
    <div class="dialog-content">
      <p class="info-text">
        Live readouts from the DSP engine. Values follow calibration and update several times per second.
      </p>
      <div class="measure-grid">
        <div class="measure-card">
          <div class="measure-value">0.0000</div>
          <div class="measure-label">Vpp (V)</div>
        </div>
        <div class="measure-card">
          <div class="measure-value">0.0000</div>
          <div class="measure-label">RMS (V)</div>
        </div>
        <div class="measure-card">
          <div class="measure-value">0.00</div>
          <div class="measure-label">DC offset (V)</div>
        </div>
        <div class="measure-card">
          <div class="measure-value">0.00</div>
          <div class="measure-label">Frequency (Hz)</div>
        </div>
        <div class="measure-card">
          <div class="measure-value">—</div>
          <div class="measure-label">Period (ms)</div>
        </div>
        <div class="measure-card">
          <div class="measure-value">48,000</div>
          <div class="measure-label">Sample rate (Hz)</div>
        </div>
      </div>
    </div>
    <div class="dialog-footer">
      <button class="btn-footer">Close</button>
    </div>
  </div>
</body>
</html>
