<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Session</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-primary: #1a1a1d;
      --bg-secondary: #212124;
      --bg-tertiary: #28282c;
      --bg-elevated: #2e2e33;
      --bg-hover: #35353b;
      --foreground: #f5f5f7;
      --text-secondary: #a1a1a6;
      --text-tertiary: #6e6e73;
      --border-subtle: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.1);
      --border-hover: rgba(255, 255, 255, 0.15);
      --icon: #71717a;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .dialog {
      width: 100%;
      max-width: 480px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }
    .dialog-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .dialog-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--foreground);
    }
    .close-btn {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.15s;
    }
    .close-btn:hover {
      background: var(--bg-tertiary);
      color: var(--foreground);
    }
    .dialog-content {
      padding: 20px;
    }
    .session-info-banner {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .session-meta {
      flex: 1;
    }
    .session-meta-label {
      font-size: 10px;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .session-meta-id {
      font-size: 12px;
      color: var(--text-secondary);
      font-family: ui-monospace, monospace;
      margin-top: 2px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group:last-child {
      margin-bottom: 0;
    }
    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .form-input {
      width: 100%;
      padding: 10px 14px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--foreground);
      font-size: 14px;
      font-family: inherit;
      transition: all 0.15s;
    }
    .form-input:focus {
      outline: none;
      border-color: var(--text-tertiary);
      background: var(--bg-hover);
      box-shadow: 0 0 0 3px rgba(113, 113, 122, 0.2);
    }
    .form-input::placeholder {
      color: var(--text-tertiary);
    }
    .form-textarea {
      min-height: 80px;
      resize: vertical;
    }
    .char-count {
      font-size: 11px;
      color: var(--text-tertiary);
      text-align: right;
      margin-top: 4px;
    }
    .form-hint {
      font-size: 11px;
      color: var(--text-tertiary);
      margin-top: 6px;
      line-height: 1.4;
    }
    .dialog-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      padding: 16px 20px;
      border-top: 1px solid var(--border-subtle);
      background: var(--bg-tertiary);
    }
    .btn {
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      border: none;
    }
    .btn-secondary {
      background: var(--bg-secondary);
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      background: var(--bg-hover);
      color: var(--foreground);
    }
    .btn-primary {
      background: var(--bg-elevated);
      color: var(--foreground);
      border: 1px solid var(--border-hover);
    }
    .btn-primary:hover {
      background: var(--bg-hover);
      border-color: var(--border-hover);
    }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-danger {
      background: transparent;
      color: #fb7185;
      border: 1px solid rgba(251, 113, 133, 0.3);
      margin-right: auto;
    }
    .btn-danger:hover {
      background: rgba(251, 113, 133, 0.1);
      border-color: #fb7185;
    }
  </style>
</head>
<body>
  <div class="dialog">
    <div class="dialog-header">
      <span class="dialog-title">Edit Session</span>
      <button class="close-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    
    <div class="dialog-content">
      <div class="session-info-banner">
        <div class="session-meta">
          <div class="session-meta-label">Session ID</div>
          <div class="session-meta-id">sess_abc123def</div>
        </div>
      </div>
      
      <div class="form-group">
        <label class="form-label">Session Name</label>
        <input type="text" class="form-input" id="session-name" placeholder="e.g., Morning Lab Testing" maxlength="100" value="Morning Lab Testing">
        <div class="char-count"><span id="name-count">18</span>/100</div>
      </div>
      
      <div class="form-group">
        <label class="form-label">Description (optional)</label>
        <textarea class="form-input form-textarea" id="session-desc" placeholder="Add a description for this session..." maxlength="500">Testing audio equipment in the lab with various microphone setups. Includes frequency response measurements and noise floor analysis.</textarea>
        <div class="char-count"><span id="desc-count">134</span>/500</div>
        <div class="form-hint">Describe what this session is about, the equipment being tested, or any other relevant details.</div>
      </div>
    </div>
    
    <div class="dialog-footer">
      <button class="btn btn-danger" onclick="handleDelete()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 4px;">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
        </svg>
        Delete
      </button>
      <button class="btn btn-primary" onclick="handleSave()">Save Changes</button>
    </div>
  </div>

  <script>
    const nameInput = document.getElementById('session-name');
    const descInput = document.getElementById('session-desc');
    const nameCount = document.getElementById('name-count');
    const descCount = document.getElementById('desc-count');
    
    nameInput.addEventListener('input', function() {
      nameCount.textContent = this.value.length;
    });
    
    descInput.addEventListener('input', function() {
      descCount.textContent = this.value.length;
    });
    
    function handleSave() {
      const name = nameInput.value.trim();
      const desc = descInput.value.trim();
      
      if (!name) {
        nameInput.focus();
        nameInput.style.borderColor = '#fb7185';
        setTimeout(() => {
          nameInput.style.borderColor = '';
        }, 2000);
        return;
      }
      
      console.log('Saving session:', { name, description: desc });
      alert('Session updated:\n\nName: ' + name + '\nDescription: ' + (desc || '(none)'));
    }
    
    function handleDelete() {
      if (confirm('Are you sure you want to delete this session?\n\nThis will also delete all recordings and data associated with it.\n\nThis action cannot be undone.')) {
        console.log('Deleting session...');
        alert('Session deleted');
      }
    }
  </script>
</body>
</html>
